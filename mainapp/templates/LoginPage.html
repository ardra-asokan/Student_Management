<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Login | CampusConnect</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>
        body {
            background: #f5f7fb;
            font-family: 'Segoe UI';
        }

        /* Header */
        .header {
            background: #2b2f42;
            padding: 15px 0;
        }
        .header h2 {
            color: #fff;
            margin: 0;
            font-weight: 600;
        }

        /* Footer */
        .footer {
            margin-top: 220px;
            background: #2b2f42;
            padding: 15px;
            color: #fff;
            text-align: center;
            font-size: 14px;
        }

        /* Cards */
        .login-card {
            border: none;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 6px 18px rgba(0,0,0,0.1);
            transition: 0.3s ease;
            background: #fff;
        }
        .login-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.15);
        }
        .login-card img {
            height: 180px;
            object-fit: cover;
        }
        .login-button {
            width: 100%;
            border-radius: 8px;
            padding: 10px;
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <div class="header text-center mb-4">
        <h2>CampusConnect Login Portal</h2>
    </div>

    <div class="container " style="margin-top:80px;" >
        <h3 class="text-center " style="margin-bottom:100px;">Select Login Type</h3>

        <div class="row justify-content-center text-center">

            <!-- Admin Card -->
            <div class="col-md-3 col-sm-6 mb-4">
                <div class="card login-card">
                    <img src="{% static 'landing/assets/img/admin.png' %}" class="card-img-top" alt="Admin">
                    <div class="card-body">
                        <h4>Admin Login</h4>
                        <p class="text-muted">Login as Administrator</p>
                        <a href="{% url 'login' %}" class="btn btn-primary login-button">Login</a>
                    </div>
                </div>
            </div>

            <!-- Teacher Card -->
            <div class="col-md-3 col-sm-6 mb-4">
                <div class="card login-card">
                    <img src="{% static 'landing/assets/img/techer.jpg' %}" class="card-img-top" alt="Teacher">
                    <div class="card-body">
                        <h4>Teacher Login</h4>
                        <p class="text-muted">Login as Teacher</p>
                        <a href="{% url 'teacher_log_in' %}" class="btn btn-success login-button">Login</a>
                    </div>
                </div>
            </div>

            <!-- Student Card -->
            <div class="col-md-3 col-sm-6 mb-4">
                <div class="card login-card">
                    <img src="{% static 'landing/assets/img/student.jpg' %}" class="card-img-top" alt="Student">
                    <div class="card-body">
                        <h4>Student Login</h4>
                        <p class="text-muted">Login as Student</p>
                        <a href="{% url 'student_log_in' %}" class="btn btn-warning login-button">Login</a>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- FOOTER -->
    <div class="footer">
        © 2025 CampusConnect · Kerala, India
    </div>

</body>
</html>
