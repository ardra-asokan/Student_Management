{% extends 'teacher_index.html' %}
{% block content %}

<div class="container-fluid d-flex justify-content-center mt-5">
    <div class="col-lg-6">

        <div class="card shadow-sm">
            <div class="card-body">

                <h4 class="text-center mb-4">Edit Marks</h4>

                <form method="POST"
                      action="{% url 'teacherapp:update_marks' mark.id %}">
                    {% csrf_token %}

                    <!-- STUDENT INFO -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">Student</label>
                        <input type="text"
                               class="form-control"
                               value="{{ mark.student.name }} ({{ mark.student.roll_no }})"
                               disabled>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Subject</label>
                        <input type="text"
                               class="form-control"
                               value="{{ mark.subject.subject_name }}"
                               disabled>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Exam</label>
                        <input type="text"
                               class="form-control"
                               value="{{ mark.exam_type }}"
                               disabled>
                    </div>

                    <!-- MARKS -->
                    <div class="mb-4">
                        <label class="form-label fw-bold">Marks</label>
                        <input type="number"
                               name="marks"
                               class="form-control"
                               min="0"
                               max="100"
                               value="{{ mark.marks }}"
                               required>
                    </div>

                    <!-- BUTTONS -->
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'teacherapp:teacher_view_marks' %}"
                           class="btn btn-secondary">
                            Cancel
                        </a>

                        <button class="btn btn-success px-4">
                            Update Marks
                        </button>
                    </div>

                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
