{% extends 'teacher_index.html' %}
{% block content %}

<style>
    /* Push footer to bottom */
    .page-wrapper {
        min-height: calc(100vh - 120px); /* adjust if header/footer height differs */
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .card-box {
        background: #ffffff;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        max-width: 700px;
        width: 100%;
    }

    label {
        font-weight: 600;
        margin-bottom: 5px;
    }

    textarea {
        resize: none;
    }
</style>

<div class="page-wrapper">
    <div class="card-box">
        <h3 class="text-center mb-4">Send Announcement</h3>

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label>Announcement Title</label>
                <input type="text"
                       name="title"
                       class="form-control"
                       placeholder="Enter announcement title"
                       required>
            </div>

            <div class="mb-3">
                <label>Message</label>
                <textarea name="message"
                          class="form-control"
                          rows="5"
                          placeholder="Write your announcement here..."
                          required></textarea>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-primary px-5">
                    Send Announcement
                </button>
            </div>

        </form>
    </div>
</div>

{% endblock %}
