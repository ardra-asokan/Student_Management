{% extends 'teacher_index.html' %}
{% block content %}

<style>
/* PAGE BACKGROUND */
.page-wrapper {
    min-height: calc(100vh - 120px);
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f4f6fb;
    padding: 40px 15px;
}

/* CARD */
.card-box {
    background: #ffffff;
    padding: 40px 38px;
    border-radius: 20px;
    box-shadow: 0 18px 45px rgba(0,0,0,0.10);
    max-width: 760px;
    width: 100%;
}

/* HEADER */
.announcement-header {
    text-align: center;
    margin-bottom: 35px;
}

.announcement-icon {
    width: 80px;
    height: 80px;
    margin: 0 auto 15px;
    border-radius: 50%;
    background: linear-gradient(135deg, #2563eb, #1e40af);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    color: #ffffff;
    box-shadow: 0 12px 30px rgba(37,99,235,0.35);
}

.announcement-header h3 {
    font-weight: 700;
    margin-bottom: 6px;
    color: #0f172a;
}

.announcement-header p {
    font-size: 14px;
    color: #64748b;
}

/* FORM */
label {
    font-weight: 600;
    font-size: 14px;
    color: #334155;
    margin-bottom: 6px;
}

.form-control {
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 14px;
    border: 1px solid #d1d5db;
}

.form-control:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
}

textarea {
    resize: none;
}

/* BUTTON */
.send-btn {
    margin-top: 15px;
    padding: 12px 42px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 30px;
    border: none;
    color: #ffffff;
    background: linear-gradient(135deg, #2563eb, #1e40af);
    box-shadow: 0 10px 25px rgba(37,99,235,0.35);
    transition: all 0.25s ease;
}

.send-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 16px 35px rgba(37,99,235,0.45);
}
</style>

<div class="page-wrapper">
    <div class="card-box">

        <!-- HEADER -->
        <div class="announcement-header">
            <div class="announcement-icon">📢</div>
            <h3>Send Announcement</h3>
            <p>Share important updates with students</p>
        </div>

        <!-- FORM -->
        <form method="POST">
            {% csrf_token %}

            <div class="mb-4">
                <label>Announcement Title</label>
                <input type="text"
                       name="title"
                       class="form-control"
                       placeholder="Enter a short and clear title"
                       required>
            </div>

            <div class="mb-4">
                <label>Message</label>
                <textarea name="message"
                          class="form-control"
                          rows="6"
                          placeholder="Write the announcement details here..."
                          required></textarea>
            </div>

            <div class="text-center">
                <button type="submit" class="send-btn">
                    Send Announcement
                </button>
            </div>

        </form>

    </div>
</div>

{% endblock %}
