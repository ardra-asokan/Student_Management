{% extends 'teacher_index.html' %}
{% block content %}

<div class="container-fluid mt-4 mb-5">
    <div class="row">

        <!-- STUDENT LIST -->
        <div class="col-md-4 col-lg-3">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <strong>Students</strong>
                </div>
                <ul class="list-group list-group-flush chat-students">
                    <li class="list-group-item active">Arjun Kumar</li>
                    <li class="list-group-item">Meera Nair</li>
                    <li class="list-group-item">Rahul Das</li>
                    <li class="list-group-item">Ananya S</li>
                </ul>
            </div>
        </div>

        <!-- CHAT AREA -->
        <div class="col-md-8 col-lg-9">
            <div class="card shadow-sm h-100 d-flex flex-column">

                <div class="card-header bg-light">
                    <strong>Chat with Student</strong>
                </div>

                <!-- MESSAGES -->
                <div class="card-body chat-body flex-grow-1">
                    <div class="message received">
                        <p>Hello sir 👋</p>
                        <small>10:30 AM</small>
                    </div>

                    <div class="message sent">
                        <p>Hello, how can I help you?</p>
                        <small>10:31 AM</small>
                    </div>
                </div>

                <!-- INPUT -->
                <div class="card-footer bg-white">
                    <form>
                        <div class="input-group">
                            <input type="text" class="form-control" placeholder="Type a message...">
                            <button class="btn btn-primary" type="button">Send</button>
                        </div>
                    </form>
                </div>

            </div>
        </div>

    </div>
</div>

<style>
.chat-body {
    background: #f8f9fa;
    overflow-y: auto;
}

.message {
    max-width: 70%;
    margin-bottom: 15px;
    padding: 10px 14px;
    border-radius: 15px;
    font-size: 14px;
}

.message.received {
    background: #ffffff;
    align-self: flex-start;
}

.message.sent {
    background: #667eea;
    color: white;
    align-self: flex-end;
    margin-left: auto;
}

.message small {
    display: block;
    font-size: 11px;
    opacity: 0.7;
    margin-top: 4px;
}
</style>

{% endblock %}
