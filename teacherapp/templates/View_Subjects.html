{% extends 'teacher_index.html' %}
{% block content %}

<style>
    h2 {
        text-align: center;
        margin-top: 30px;
        font-weight: 700;
        color: #2c3e50;
    }

    .table-container {
        width: 65%;
        margin: 40px auto;
        background-color: #f8f9fb;
        border-radius: 10px;
        padding: 20px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        overflow-x: auto;
        margin-bottom: 500px;

    }

    table {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
        border-radius: 10px;
        overflow: hidden;
    }

    thead {
        background-color: #2f4050;
        color: #fff;
    }

    th, td {
        padding: 12px 15px;
        font-size: 14px;
        border-bottom: 1px solid #e0e0e0;
    }

    tr:nth-child(even) { background-color: #f9f9f9; }
    tr:hover { background-color: #eef1f5; }
</style>

<h2>My Assigned Subjects</h2>

<div class="table-container">
    <table>
        <thead>
            <tr>
                <th>Subject Code</th>
                <th>Subject Name</th>
                <th>Class</th>
                <th>Semester</th>
            </tr>
        </thead>
        <tbody>
            {% for i in data %}
            <tr>
                <td>{{ i.subject.subject_code }}</td>
                <td>{{ i.subject.subject_name }}</td>
                <td>{{ i.class_name }}</td>
                <td>{{ i.semester }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4" class="text-center">
                    No subjects assigned yet.
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

{% endblock %}
