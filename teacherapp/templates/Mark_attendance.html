<!DOCTYPE html>
{% extends 'teacher_index.html' %}
{% block content %}
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Mark Attendance</title>

    <style>
        .page-title {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 25px;
            color: #2c3e50;
        }

        .card-box {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }

        label {
            font-weight: 600;
            margin-bottom: 6px;
        }

        select, input[type="date"] {
            height: 45px;
            border-radius: 7px;
            border: 1px solid #ccc;
            padding: 8px 12px;
        }

        .btn-submit {
            background: #3498db;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 7px;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-submit:hover {
            background: #1d6fa5;
        }

        .attendance-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
            background: white;
            border-radius: 10px;
            overflow: hidden;
        }

        .attendance-table th {
            background: #2f4050;
            color: white;
            padding: 12px;
        }

        .attendance-table td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        .attendance-table tr:nth-child(even) {
            background: #f8f9fb;
        }

        .radio-label {
            margin-right: 15px;
            font-weight: 500;
        }
    </style>
</head>

<body>

<div class="content-body">
    <div class="container-fluid mt-3">

        <h3 class="page-title" style="text-align: center;">Mark Attendance</h3>

        <!-- FILTER CARD -->
        <div class="card-box" style="margin-top: 15px;">
            <form method="GET" class="row g-3">

                <div class="col-md-6">
                    <label>Select Subject</label>
                    <select name="subject" class="form-control" required>
                        <option value="">-- Select --</option>
                        {% for s in assigned_subjects %}
                        <option value="{{ s.id }}" {% if selected_subject == s.id|stringformat:"s" %} selected {% endif %}>
                            {{ s.subject.subject_name }} ({{ s.class_name }})
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-md-6">
                    <label>Select Class</label>
                    <select name="class" class="form-control" required>
                        <option value="">-- Select --</option>
                        {% for s in assigned_subjects %}
                        <option value="{{ s.class_name }}" {% if selected_class == s.class_name %}selected{% endif %}>
                            {{ s.class_name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-12 mt-3">
                    <button type="submit" class="btn-submit">Load Students</button>
                </div>

            </form>
        </div>

        <!-- STUDENT ATTENDANCE TABLE -->
        {% if students %}
        <div class="card-box">

            <form method="POST" action="{% url 'save_attendance' %}">
                {% csrf_token %}

                <input type="hidden" name="subject_id" value="{{ selected_subject }}">
                <input type="hidden" name="class_name" value="{{ selected_class }}">
                <input type="hidden" name="date" value="{{ today }}">

                <table class="attendance-table">
                    <tr>
                        <th>Student Name</th>
                        <th>Roll No</th>
                        <th>Status</th>
                    </tr>

                    {% for st in students %}
                    <tr>
                        <td>{{ st.name }}</td>
                        <td>{{ st.roll_no }}</td>
                        <td>
                            <label class="radio-label">
                                <input type="radio" name="student_{{ st.id }}" value="Present" checked>
                                Present
                            </label>

                            <label class="radio-label">
                                <input type="radio" name="student_{{ st.id }}" value="Absent">
                                Absent
                            </label>
                        </td>
                    </tr>
                    {% endfor %}
                </table>

                <div class="text-center mt-4">
                    <button type="submit" class="btn-submit">Save Attendance</button>
                </div>
            </form>

        </div>
        {% endif %}

    </div>
</div>

</body>
</html>

{% endblock %}
