{% extends 'teacher_index.html' %}
{% block content %}

<style>
.page-title {
    font-size: 26px;
    font-weight: 700;
    color: #2c3e50;
}

.card-box {
    background: #ffffff;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    margin-bottom: 25px;
}

label {
    font-weight: 600;
    margin-bottom: 6px;
}

select {
    height: 45px;
    border-radius: 8px;
}

.btn-submit {
    background: #4f46e5;
    color: #fff;
    border: none;
    padding: 10px 24px;
    border-radius: 8px;
    font-weight: 600;
}

.btn-submit:hover {
    background: #4338ca;
}

.attendance-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}

.attendance-table th {
    background: #2f4050;
    color: white;
    padding: 12px;
    text-align: center;
}

.attendance-table td {
    padding: 12px;
    border-bottom: 1px solid #eee;
    text-align: center;
}

.attendance-table tr:nth-child(even) {
    background: #f9fafb;
}

.radio-group label {
    margin-right: 15px;
    font-weight: 500;
}
</style>

<div class="content-body">
    <div class="container-fluid d-flex justify-content-center mt-4 mb-5">

        <div class="col-xl-9 col-lg-10 col-md-12">

            <!-- TITLE -->
            <div class="text-center mb-4">
                <h3 class="page-title">Mark Attendance</h3>
                <p class="text-muted mb-0">Select subject, department and semester</p>
            </div>

            <!-- FILTER CARD -->
            <div class="card-box">
                <form method="GET" class="row g-3 justify-content-center">

                    <div class="col-md-6">
                        <label>Subject</label>
                        <select name="subject" class="form-control" required>
                            <option value="">-- Select Subject --</option>
                            {% for s in assigned_subjects %}
                            <option value="{{ s.id }}"
                                {% if selected_subject == s.id|stringformat:"s" %}selected{% endif %}>
                                {{ s.subject.subject_name }} ({{ s.class_name }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label>Department</label>
                        <select name="department" class="form-control" required>
                            <option value="">-- Select --</option>
                            <option>CSE</option>
                            <option>ECE</option>
                            <option>EEE</option>
                            <option>MECH</option>
                            <option>CIVIL</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label>Semester</label>
                        <select name="semester" class="form-control" required>
                            <option value="">-- Select --</option>
                            <option>S1</option><option>S2</option><option>S3</option>
                            <option>S4</option><option>S5</option><option>S6</option>
                            <option>S7</option><option>S8</option>
                        </select>
                    </div>

                    <div class="col-12 text-center mt-3">
                        <button class="btn-submit">Load Students</button>
                    </div>

                </form>
            </div>

            <!-- STUDENT TABLE -->
            {% if students %}
            <div class="card-box">

                <form method="POST" action="{% url 'teacherapp:save_attendance' %}">
                    {% csrf_token %}
                   <input type="hidden" name="att_date" value="{{ today|date:'Y-m-d' }}">

                    <input type="hidden" name="subject_id" value="{{ selected_subject }}">

                    <table class="attendance-table">
                        <thead>
                            <tr>
                                <th>Student Name</th>
                                <th>Roll No</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for st in students %}
                            <tr>
                                <td>{{ st.name }}</td>
                                <td>{{ st.roll_no }}</td>
                                <td class="radio-group">
                                    <label>
                                        <input type="radio" name="student_{{ st.id }}" value="Present" checked>
                                        Present
                                    </label>
                                    <label>
                                        <input type="radio" name="student_{{ st.id }}" value="Absent">
                                        Absent
                                    </label>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>

                    <div class="text-center mt-4">
                        <button type="submit" class="btn-submit">
                            Save Attendance
                        </button>
                    </div>

                </form>
            </div>
            {% endif %}

        </div>
    </div>
</div>

{% endblock %}
