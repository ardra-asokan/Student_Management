<!DOCTYPE html>
{% extends 'teacher_index.html' %}
{% block content %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>View Attendance</title>

    <style>
        .card-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }
        label { font-weight: 600; }
        select, input[type="date"] {
            height: 45px; border-radius: 7px;
        }
        table {
            width: 100%; border-collapse: collapse;
            margin-top: 20px;
            background: white; border-radius: 10px;
            overflow: hidden;
        }
        th {
            background: #2f4050; color: white;
            padding: 10px;
        }
        td {
            padding: 10px; border-bottom: 1px solid #eee;
        }
        tr:nth-child(even) {
            background: #f8f9fb;
        }
    </style>
</head>

<body>

<div class="container mt-4">

    <div class="card-box">
        <h3 class="mb-3">View Attendance</h3>

        <form method="GET" class="row g-3">

            <div class="col-md-4">
                <label>Select Date</label>
                <input type="date" class="form-control" name="date"
                value="{{ selected_date }}">
            </div>

            <div class="col-md-4">
                <label>Select Subject</label>
                <select name="subject" class="form-control">
                    <option value="">-- Select --</option>
                    {% for s in subjects %}
                    <option value="{{ s.id }}" {% if selected_subject == s.id|stringformat:"s" %}selected{% endif %}>
                        {{ s.subject_name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-4">
                <label>Select Class</label>
                <select name="class" class="form-control">
                    <option value="">-- Select --</option>
                    <option {% if selected_class == 'CSE A' %}selected{% endif %}>CSE A</option>
                    <option {% if selected_class == 'CSE B' %}selected{% endif %}>CSE B</option>
                    <option {% if selected_class == 'CSE C' %}selected{% endif %}>CSE C</option>
                </select>
            </div>

            <div class="col-12 mt-3">
                <button class="btn btn-primary">View</button>
            </div>

        </form>
    </div>

    {% if records %}
    <div class="card-box">

        <h4>Attendance for {{ selected_date }}</h4>

        <table>
            <tr>
                <th>Student Name</th>
                <th>Roll No</th>
                <th>Status</th>
            </tr>

            {% for r in records %}
            <tr>
                <td>{{ r.student.name }}</td>
                <td>{{ r.student.roll_no }}</td>
                <td>{{ r.status }}</td>
            </tr>
            {% endfor %}
        </table>
    </div>
    {% endif %}

</div>

</body>
</html>
{% endblock %}
