<!DOCTYPE html>
{% extends 'index.html' %}
{% block content %}
<html>
<head>
    <meta charset="UTF-8">
    <title>View Marks</title>
    <style>

    </style>
</head>

<body>

<div class="container d-flex justify-content-center mt-5" style="margin-bottom: 380px;">
    <div class="card shadow-lg w-100" style="max-width: 600px;">
<div class="card-body">

<h4 class="text-center fw-bold mb-4">View Marks</h4>

<form>

    <div class="form-group mb-3">
        <label>Student Roll Number</label>
        <input type="text" class="form-control" name="roll">
    </div>

    <div class="form-group mb-3">
        <label>Select Semester</label>
        <select class="form-control" name="semester">
            <option selected>Select Semester</option>
            <option>S1</option>
            <option>S2</option>
            <option>S3</option>
            <option>S4</option>
            <option>S5</option>
            <option>S6</option>
            <option>S7</option>
            <option>S8</option>
        </select>
    </div>

    <div class="text-center mt-4">
        <button type="submit" class="btn btn-primary">View Marks</button>
    </div>

</form>

</div>
</div>
</div>

</body>
</html>
{% endblock %}
