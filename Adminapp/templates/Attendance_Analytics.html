<!DOCTYPE html>
{% extends 'index.html' %}
{% block content %}
<html>
<head><title>Attendance Analytics</title></head>

<body>

<div class="container d-flex justify-content-center mt-5" style="margin-bottom: 380px;">
    <div class="card shadow-lg w-100" style="max-width: 600px;">
<div class="card-body">

<h4 class="text-center fw-bold mb-4">Attendance Analytics</h4>

<form>

    <div class="form-group mb-3">
        <label>Department</label>
        <select class="form-control">
            <option selected>Select Department</option>
            <option>CSE</option>
            <option>CIVIL</option>
            <option>MECH</option>
            <option>ECE</option>
            <option>EEE</option>
        </select>
    </div>

    <div class="form-group mb-3">
        <label>Semester</label>
        <select class="form-control">
             <option selected>Select Semester</option>
            <option>S1</option>
            <option>S2</option>
            <option>S3</option>
            <option>S4</option>
            <option>S5</option>
            <option>S6</option>
            <option>S7</option>
            <option>S8</option>
        </select>
    </div>

    <div class="text-center mt-4">
        <button class="btn btn-primary">View Analytics</button>
    </div>

</form>

</div>
</div>
</div>

</body>
</html>
{% endblock %}
