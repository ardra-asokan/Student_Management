<!DOCTYPE html>
{% extends 'index.html' %}
{% block content %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Assigned Subject</title>

    <style>
        .form-card {
            width: 100%;
            max-width: 600px;
            margin: 60px auto;
            padding: 30px;
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        .form-control {
            border-radius: 8px;
        }

        button.btn-primary {
            box-shadow: 0 3px 8px rgba(0, 123, 255, 0.4);
        }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center">
    <div class="form-card">
        <h4 class="text-center mb-4 fw-bold">Edit Assigned Subject</h4>

        <form method="post" action="{% url 'Adminapp:update_assigned_subject' a_id=assign.id %}">
            {% csrf_token %}


            <div class="form-group mb-3">
                <label>Teacher</label>
                <select class="form-control" name="teacher">
                    <option>{{ assigned.teacher.name }}</option>
                    {% for i in teachers %}
                        <option>{{ i.name }}</option>
                    {% endfor %}
                </select>
            </div>


            <div class="form-group mb-3">
                <label>Subject</label>
                <select class="form-control" name="subject">
                    <option>{{ assigned_subject.subject_name }}</option>
                    {% for i in subjects %}
                        <option>{{ i.subject_name }}</option>
                    {% endfor %}
                </select>
            </div>

        
            <div class="form-group mb-3">
                <label>Class</label>
                <input type="text" class="form-control" name="class"
                       value="{{ assigned.class_name }}" placeholder="Class (e.g., CSE A)">
            </div>


            <div class="form-group mb-3">
                <label>Semester</label>
                <select class="form-control" name="semester">
                    <option>{{ assigned.semester }}</option>
                    <option>1</option><option>2</option><option>3</option>
                    <option>4</option><option>5</option><option>6</option>
                </select>
            </div>

            <div class="text-center mt-4">
                <button type="submit" class="btn btn-primary">Update</button>
                <button type="reset" class="btn btn-light ms-2">Cancel</button>
            </div>

        </form>
    </div>
</div>

</body>
</html>
{% endblock %}
