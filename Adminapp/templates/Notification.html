<!DOCTYPE html>
{% extends 'index.html' %}
{% block content %}
<html>
<head><title>Send Email</title></head>

<body>

<div class="container d-flex justify-content-center mt-5" style="margin-bottom: 240px;">
    <div class="card shadow-lg w-100" style="max-width: 600px;">
<div class="card-body">

<h4 class="text-center fw-bold mb-4">Send Email Notification</h4>

<form>

    <div class="form-group mb-3">
        <label>Email To</label>
        <input type="email" class="form-control" placeholder="Enter email">
    </div>

    <div class="form-group mb-3">
        <label>Subject</label>
        <input type="text" class="form-control" placeholder="Email subject">
    </div>

    <div class="form-group mb-3">
        <label>Message</label>
        <textarea class="form-control" rows="4"></textarea>
    </div>

    <div class="text-center mt-4">
        <button class="btn btn-primary">Send Email</button>
    </div>

</form>

</div>
</div>
</div>

</body>
</html>
{% endblock %}
