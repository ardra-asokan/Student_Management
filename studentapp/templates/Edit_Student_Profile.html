{% extends 'student_index.html' %}
{% load static %}
{% block content %}

<style>
.profile-wrapper {
    max-width: 800px;
    margin: 30px auto;
}

.profile-card {
    background: #ffffff;
    padding: 30px;
    border-radius: 14px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.06);
}

.profile-header {
    text-align: center;
    margin-bottom: 25px;
}

.profile-img {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #f1f1f1;
}

.form-group {
    margin-bottom: 15px;
}
</style>

<div class="content-body">
    <div class="container-fluid">

        <div class="profile-wrapper">
            <div class="profile-card">

                <h4 class="mb-4 text-center">Edit Profile</h4>

                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}

                    <!-- PHOTO -->
                    <div class="profile-header">
                        {% if student.profile_photo %}
                            <img src="{{ student.profile_photo.url }}" class="profile-img">
                        {% else %}
                            <img src="{% static 'images/default-profile.png' %}" class="profile-img">
                        {% endif %}
                        <div class="mt-3">
                            <input type="file" name="photo" class="form-control">
                        </div>
                    </div>

                    <!-- READ ONLY FIELDS -->
                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" class="form-control" value="{{ student.name }}" readonly>
                    </div>

                    <div class="form-group">
                        <label>Roll No</label>
                        <input type="text" class="form-control" value="{{ student.roll_no }}" readonly>
                    </div>

                    <!-- EDITABLE -->
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" name="email" value="{{ student.email }}" class="form-control">
                    </div>

                    <div class="form-group">
                        <label>Phone</label>
                        <input type="text" name="phone" value="{{ student.phone }}" class="form-control">
                    </div>

                    <div class="form-group">
                        <label>Address</label>
                        <textarea name="address" class="form-control" rows="3">{{ student.address }}</textarea>
                    </div>

                    <div class="text-center mt-4">
                        <button type="submit" class="btn btn-primary px-4">
                            Update Profile
                        </button>
                        <a href="{% url 'student_profile' %}" class="btn btn-primary px-4 ml-2">
                            Cancel
                        </a>
                    </div>

                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
