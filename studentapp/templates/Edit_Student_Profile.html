{% extends 'student_index.html' %}
{% load static %}
{% block content %}

<style>
.profile-wrapper {
    max-width: 900px;
    margin: 30px auto;
}

.profile-card {
    background: #ffffff;
    padding: 30px;
    border-radius: 14px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.06);
}

.profile-header {
    text-align: center;
    margin-bottom: 30px;
}

.profile-img {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #f1f1f1;
}

.section-card {
    background: #f9fafc;
    border-radius: 10px;
    padding: 20px;
}

.section-title {
    font-weight: 700;
    font-size: 17px;
    margin-bottom: 20px;
    color: #2f4050;
    border-bottom: 1px solid #e5e7eb;
    padding-bottom: 8px;
}

.form-group {
    margin-bottom: 15px;
}

.form-label {
    font-weight: 600;
}
</style>

<div class="content-body">
    <div class="container-fluid">

        <div class="profile-wrapper">
            <div class="profile-card">

                <h4 class="mb-4 text-center">Edit Profile</h4>

                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}

                    <!-- PROFILE PHOTO -->
                    <div class="profile-header">
                        {% if student.profile_photo %}
                            <img src="{{ student.profile_photo.url }}" class="profile-img">
                        {% else %}
                            <img src="{% static 'images/default-profile.png' %}" class="profile-img">
                        {% endif %}
                        <div class="mt-3">
                            <input type="file" name="photo" class="form-control" accept="image/*">
                        </div>
                    </div>

                    <!-- STUDENT DETAILS -->
                    <div class="section-card">
                        <div class="section-title">Student Details</div>

                        <!-- READ ONLY -->
                        <div class="form-group">
                            <label class="form-label">Name</label>
                            <input type="text" class="form-control" value="{{ student.name }}" readonly>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Roll No</label>
                            <input type="text" class="form-control" value="{{ student.roll_no }}" readonly>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Department</label>
                            <input type="text" class="form-control" value="{{ student.department }}" readonly>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Semester</label>
                            <input type="text" class="form-control" value="{{ student.semester }}" readonly>
                        </div>

                        <!-- EDITABLE -->
                        <div class="form-group">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" value="{{ student.email }}">
                        </div>

                        <div class="form-group">
                            <label class="form-label">Phone</label>
                            <input type="text" name="phone" class="form-control" value="{{ student.phone }}">
                        </div>

                        <div class="form-group">
                            <label class="form-label">Address</label>
                            <textarea name="address" class="form-control" rows="3">{{ student.address }}</textarea>
                        </div>
                    </div>

                    <!-- BUTTONS -->
                    <div class="text-center mt-4">
                        <button type="submit" class="btn btn-primary px-4">
                            Update Profile
                        </button>
                        <a href="{% url 'studentapp:student_profile' %}" class="btn btn-primary px-4 ms-2">
                            Cancel
                        </a>
                    </div>

                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
