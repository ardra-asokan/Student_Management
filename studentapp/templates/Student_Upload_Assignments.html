{% extends 'student_index.html' %}
{% block content %}

<style>
/* Page Title */
.page-title {
    font-size: 30px;
    font-weight: 700;
    color: #1f2937;
}

/* Subtitle */
.page-subtitle {
    font-size: 14px;
    color: #6b7280;
}

/* Card */
.upload-card {
    border-radius: 18px;
    background: #ffffff;
}

/* Form labels */
.form-label {
    font-size: 14px;
    color: #374151;
}

/* Select & input */
.form-select,
.form-control {
    border-radius: 12px;
    padding: 10px 14px;
}

/* Upload icon box */
.upload-box {
    border: 2px dashed #c7d2fe;
    border-radius: 14px;
    padding: 25px;
    text-align: center;
    background: #eef2ff;
    cursor: pointer;
}

.upload-box:hover {
    background: #e0e7ff;
}

/* Button */
.submit-btn {
    background: linear-gradient(135deg, #6366f1, #4f46e5);
    border: none;
    border-radius: 30px;
    padding: 10px 28px;
    font-size: 14px;
}

.submit-btn:hover {
    opacity: 0.9;
}

/* Empty State */
.empty-state {
    font-size: 16px;
    color: #6b7280;
}
</style>

<div class="container mt-4" style="margin-bottom:330px;">

    <!-- Header -->
    <div class="text-center mb-4">
        <h2 class="page-title"> Upload Assignment</h2>
        <p class="page-subtitle">Submit your assignment before the deadline</p>
    </div>

    <!-- Card -->
    <div class="card upload-card shadow-sm border-0">
        <div class="card-body p-4">

            {% if assignments %}
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                <!-- Assignment Select -->
                <div class="mb-4">
                    <label class="form-label fw-semibold"> Select Assignment</label>
                    <select name="assignment" class="form-select" required>
                        <option value="">-- Choose Assignment --</option>
                        {% for a in assignments %}
                        <option value="{{ a.id }}">
                            {{ a.subject.subject_name }} – {{ a.title }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <!-- File Upload -->
                <div class="mb-4">
                    <label class="form-label fw-semibold">📎 Upload File</label>
                    <label class="upload-box w-100">
                        <input type="file" name="file" class="d-none" required>
                        <i class="fa fa-cloud-upload fa-2x text-primary mb-2"></i>
                        <p class="mb-0 text-muted">
                            Click to upload or drag & drop your file
                        </p>
                    </label>
                </div>

                <!-- Submit -->
                <div class="text-end">
                    <button type="submit" class="btn submit-btn text-white">
                         Submit Assignment
                    </button>
                </div>

            </form>
            {% else %}
                <!-- Empty State -->
                <div class="text-center py-5">
                    <i class="fa fa-check-circle fa-3x text-success mb-3"></i>
                    <p class="empty-state mb-0">
                         All assignments have been submitted!
                    </p>
                </div>
            {% endif %}

        </div>
    </div>

</div>

{% endblock %}
