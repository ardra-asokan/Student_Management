{% extends 'student_index.html' %}
{% block content %}

<h4>Internal Marks</h4>

<table class="table table-bordered">
    <tr>
        <th>Subject</th>
        <th>Internal Mark</th>
    </tr>

    {% for m in marks %}
    <tr>
        <td>{{ m.subject }}</td>
        <td>{{ m.mark }}</td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="2">No marks available</td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
