{% extends 'student_index.html' %}
{% block content %}

<div class="content-body">
    <div class="container-fluid mt-4">

        <h4 class="mb-4">Internal Marks</h4>

        {% if marks %}
        <table class="table table-bordered text-center">
            <thead class="table-light">
                <tr>
                    <th>Subject</th>
                    <th>Exam Type</th>
                    <th>Marks</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody>
                {% for m in marks %}
                <tr>
                    <td>{{ m.subject }}</td>
                    <td>{{ m.exam_type }}</td>
                    <td>{{ m.marks }}</td>
                    <td>{{ m.date }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% else %}
            <p class="text-muted text-center">No internal marks available</p>
        {% endif %}

    </div>
</div>

{% endblock %}
